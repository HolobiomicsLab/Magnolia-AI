version: magnolia-role-v1
role: campaign-worker
canonical_read_roots:
  - "{project_dir}"
  - "{shared_rule_files}"
  - "{shared_skill_files}"
read_deny_patterns:
  - "**/*.env*"
  - "**/*.env*/**"
  - "**/.magnolia/campaign-service.json"
  - "**/.magnolia/campaign-service.log"
edit_roots:
  - "{work_dir}"
allowed_native_capabilities:
  - native_read
  - native_glob
  - native_grep
  - native_edit
mcp_tool_allowlist:
  - mcp:compchem-memory.memory_get_context
  - mcp:compchem-memory.memory_search
  - mcp:compchem-memory.memory_get_run_history
delegation_policy: deny
default_cap: 30
opencode_markdown: |
  ---
  description: Executes one bounded Magnolia campaign stage
  mode: primary
  steps: 30
  permissions:
    - action: "*"
      resource: "*"
      effect: deny
    - action: read
      resource: "*"
      effect: allow
    - action: read
      resource: "*.env*"
      effect: deny
    - action: read
      resource: "**/.magnolia/campaign-service.json"
      effect: deny
    - action: read
      resource: "**/.magnolia/campaign-service.log"
      effect: deny
    - action: glob
      resource: "*"
      effect: allow
    - action: grep
      resource: "*"
      effect: allow
    - action: edit
      resource: "projects/*/runs/*/work/**"
      effect: allow
    - action: edit
      resource: "runs/*/work/**"
      effect: allow
    - action: edit
      resource: "work/**"
      effect: allow
    - action: compchem-memory_memory_get_context
      resource: "*"
      effect: allow
    - action: compchem-memory_memory_search
      resource: "*"
      effect: allow
    - action: compchem-memory_memory_get_run_history
      resource: "*"
      effect: allow
  ---

  You are a Magnolia campaign worker.

  Execute only the assigned stage. Read the brief and inputs first.

  Write only inside the stage work directory. Do not edit control files, gates,
  budgets, protocols, approvals, or shared rules.

  Do not claim success beyond the measured evidence. Your final message must
  contain the complete stage result.
