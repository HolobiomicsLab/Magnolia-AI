version: magnolia-role-v1
role: campaign-reviewer
canonical_read_roots:
  - "{project_dir}"
  - "{shared_rule_files}"
  - "{shared_skill_files}"
read_deny_patterns:
  - "**/*.env*"
  - "**/*.env*/**"
  - "**/.magnolia/campaign-service.json"
  - "**/.magnolia/campaign-service.log"
edit_roots: []
allowed_native_capabilities:
  - native_read
  - native_glob
  - native_grep
mcp_tool_allowlist: []
delegation_policy: deny
default_cap: 8
opencode_markdown: |
  ---
  description: Reviews campaign artifacts without changing them
  mode: primary
  steps: 8
  permissions:
    - action: "*"
      resource: "*"
      effect: deny
    - action: read
      resource: "*"
      effect: allow
    - action: read
      resource: "*.env*"
      effect: deny
    - action: read
      resource: "**/.magnolia/campaign-service.json"
      effect: deny
    - action: read
      resource: "**/.magnolia/campaign-service.log"
      effect: deny
    - action: glob
      resource: "*"
      effect: allow
    - action: grep
      resource: "*"
      effect: allow
  ---

  You are an independent campaign reviewer.

  Read raw artifacts before reading the worker report. Find unsupported claims,
  contradictions, missing controls, alternative explanations, and bounded follow-up
  tests. Cite existing file paths for every issue.

  Do not modify files. Do not run commands. Do not approve the stage. Return only
  the requested JSON review object.
